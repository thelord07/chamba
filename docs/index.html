let lang = 'es';

const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const pills = t.editorPills.map(e => `<span style="font-size:13px;font-weight:500;color:var(--text);background:var(--bg2);border:1px solid var(--border);padding:5px 12px;border-radius:8px;">${esc(e)}</span>`).join('');
  const benefits = t.benefits.map(b => `
    <div class="card-benefit" style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;">
      <span style="font-family:'JetBrains Mono';font-size:13px;color:var(--accent);font-weight:600;">${esc(b.no)}</span>
      <h3 style="font-family:'Space Grotesk';font-weight:600;font-size:20px;letter-spacing:-0.02em;margin:0;line-height:1.2;">${esc(b.title)}</h3>
      <p style="font-size:14.5px;line-height:1.55;color:var(--muted);margin:0;">${esc(b.body)}</p>
    </div>`).join('');
  const tools = t.tools.map(tool => `
    <div class="row-hover" style="display:grid;grid-template-columns:1.1fr 1fr 1.4fr;padding:15px 22px;border-bottom:1px solid var(--border);align-items:center;">
      <span style="font-family:'JetBrains Mono';font-size:13.5px;color:var(--accent);font-weight:500;">${esc(tool.name)}</span>
      <span style="font-family:'JetBrains Mono';font-size:12.5px;color:var(--muted);">${esc(tool.in)}</span>
      <span style="font-size:14px;color:var(--text);">${esc(tool.out)}</span>
    </div>`).join('');
  const flow = t.flow.map(s => `
    <div style="position:relative;padding:0 0 26px 30px;">

function flash(btn) {
  const original = btn.textContent;
  btn.textContent = CONTENT[lang].copied;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = original; }, 1600);
}

function wire() {
  document.getElementById('langBtn').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; document.documentElement.lang = lang; render(); };
  document.getElementById('copyInstall').onclick = (e) => { try { navigator.clipboard.writeText('npx -y @chamba/mcp'); } catch (_) {} flash(e.currentTarget); };
  document.getElementById('copyCfg').onclick = (e) => { try { navigator.clipboard.writeText(EDITORS[editorIdx].config); } catch (_) {} flash(e.currentTarget); };
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { editorIdx = Number(b.getAttribute('data-tab')); render(); }; });
}

render();
