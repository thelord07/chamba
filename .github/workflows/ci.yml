name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # CHAMBA-015: the parche client must behave the same on Linux, Windows and macOS
    # (macOS also has a case-insensitive filesystem, like Windows). fail-fast off so a
    # failure on one OS doesn't hide the others.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format
        run: pnpm biome check .

      # Build before typecheck: packages resolve each other's types from dist/
      # (e.g. @chamba/adapters imports @chamba/core), which doesn't exist on a clean checkout.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      # Smoke gate: the built MCP binary starts and the environment is healthy.
      # `doctor` exits non-zero when a check fails (warnings are allowed).
      - name: Doctor
        run: node packages/mcp/dist/main.js doctor
