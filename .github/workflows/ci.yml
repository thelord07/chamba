name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format
        run: pnpm biome check .

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # Smoke gate: the built MCP binary starts and the environment is healthy.
      # `doctor` exits non-zero when a check fails (warnings are allowed).
      - name: Doctor
        run: node packages/mcp/dist/main.js doctor
